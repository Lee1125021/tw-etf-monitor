name: Update ETF monitor

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: auto
        type: choice
        options:
          - auto
          - intraday
          - close
  schedule:
    # Run early enough to absorb observed GitHub schedule delays.
    # Taiwan time: 10:41, 10:49, 15:31, 16:11, 18:11, weekdays.
    - cron: '41 2 * * 1-5'
    - cron: '49 2 * * 1-5'
    - cron: '31 7 * * 1-5'
    - cron: '11 8 * * 1-5'
    - cron: '11 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: etf-monitor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          # Scheduled runs can be queued with an older event SHA. Always start from the
          # latest main branch so a preceding data run cannot cause a non-fast-forward push.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve mode
        if: github.event_name != 'pull_request'
        id: mode
        shell: bash
        run: |
          INPUT_MODE='${{ github.event.inputs.mode }}'
          EVENT_SCHEDULE='${{ github.event.schedule }}'
          if [ -n "$INPUT_MODE" ] && [ "$INPUT_MODE" != "auto" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = '41 2 * * 1-5' ] || [ "$EVENT_SCHEDULE" = '49 2 * * 1-5' ]; then
            echo 'mode=intraday' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = '31 7 * * 1-5' ] || [ "$EVENT_SCHEDULE" = '231 7 * * 1-5' ]; then
            echo 'mode=close' >> "$GITHUB_OUTPUT"
          else
            HOUR_TW=$(TZ=Asia/Taipei date +%H)
            if [ "$HOUR_TW" -lt 13 ]; then
              echo "mode=intraday" >> "$GITHUB_OUTPUT"
            else
              echo "mode=close" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update verified data
        id: update_data
        continue-on-error: true
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ '${{ steps.mode.outputs.mode }}' = 'intraday' ]; then
            python src/monitor.py --mode intraday --not-before 10:45 --attempts 3 --retry-seconds 45
          else
            python src/monitor.py --mode close --not-before 15:35 --attempts 4 --retry-seconds 90
          fi

      - name: Commit generated data
        if: github.event_name != 'pull_request' && steps.update_data.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public data
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'chore: update ETF monitor data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Flag failed validation
        if: steps.update_data.outcome == 'failure'
        run: exit 1
