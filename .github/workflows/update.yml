name: Update ETF monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: false
        default: auto
        type: choice
        options:
          - auto
          - intraday
          - close
  schedule:
    # Taiwan time (UTC+8): 10:55, 16:10, 16:22, Monday-Friday.
    - cron: '55 2 * * 1-5'
    - cron: '10 8 * * 1-5'
    - cron: '22 8 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: etf-monitor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          INPUT_MODE='${{ github.event.inputs.mode }}'
          if [ -n "$INPUT_MODE" ] && [ "$INPUT_MODE" != "auto" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          else
            HOUR_TW=$(TZ=Asia/Taipei date +%H)
            if [ "$HOUR_TW" -lt 13 ]; then
              echo "mode=intraday" >> "$GITHUB_OUTPUT"
            else
              echo "mode=close" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update verified data
        run: python src/monitor.py --mode '${{ steps.mode.outputs.mode }}'

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public data
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'chore: update ETF monitor data'
            git push
          fi
